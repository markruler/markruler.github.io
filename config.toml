baseURL = "https://markruler.com/"
DefaultContentLanguage = "ko"
languageCode = "ko-kr"
title = "컴퓨터로 할 수 있는 것" # will set 'og:site_name'
enableRobotsTXT = true
theme = [ "hugo-brutalist" ]

[services]
# [services.googleAnalytics]
# id = "G-FFMDWZ27TN"

# https://gohugo.io/content-management/taxonomies/
[taxonomies]
tag = "tags"
category = "categories"
series = "series"

[markup]
  defaultMarkdownHandler = "goldmark"
  # defaultMarkdownHandler = "blackFriday"
[markup.tableOfContents]
  ordered = false
  startLevel = 2
  endLevel = 4
[markup.goldmark]
  [markup.goldmark.extensions]
    definitionList = true
    footnote = true
    linkify = true
    strikethrough = true
    table = true
    taskList = true
    typographer = true
  [markup.goldmark.parser]
    attribute = true
    autoHeadingID = true
    autoHeadingIDType = "github"
  [markup.goldmark.renderer]
    hardWraps = false
    unsafe = true # for raw HTML tag (ex: video)
    xhtml = false
[markup.blackFriday]
  hrefTargetBlank = false
[markup.highlight]
  codeFences = true
  guessSyntax = false
  hl_lines = 0
  lineNos = false
  anchorLineNos = false
  lineAnchors = 1
  lineNoStart = 1
  lineNumbersInTable = false
  noClasses = true
  # https://xyproto.github.io/splash/docs/longer/all.html
  # style = "api"
  # style = "dracula" # 메서드명이 초록색이라서 기능을 빨리 파악할 수 있고, 주석과 뚜렷하게 구별되는 코드 색상
  # style = "fruity"
  # style = "monokai"
  # style = "native"
  # style = "paraiso-dark"
  style = "rrt"
  # style = "solarized-dark"
  # style = "solarized-dark256"
  # style = "vim"
  tabWidth = 2

[params]
favicon = "/images/favicon.ico"
description = "Markruler 기술 블로그"  # will set 'og:description'
utm_source = "markruler.com"
utm_medium = "blog"

enableOpenGraph = true
enableTwitterCards = true
images = ["/images/master/markruler-wave.webp"]
enableAutoDarkMode = true

[params.author]
name = "Markruler"
email = "imcxsu@gmail.com"

[[menu.main]]
url = "/about"
name = "About"
weight = 1
[[menu.main]]
url = "/posts"
name = "Posts"
weight = 2
[[menu.main]]
url = "/categories"
name = "Categories"
weight = 3
[[menu.main]]
url = "/tags"
name = "Tags"
weight = 4
[[menu.main]]
url = "/index.xml"
name = "RSS Feed"
weight = 10
